[project]
name = "sigshell"
version = "1.0.0"
description = "A natural-language shell for the sigscores R package, served over MCP"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Enrico Adamo" }, { name = "Marco Riva" }]
dependencies = ["mcp==2.3.0", "starlette", "uvicorn", "python-multipart"]

[project.scripts]
sigshell-server = "sigshell.server:main"
sigshell-ui = "sigshell.web:main"

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sigshell"]

[tool.pytest.ini_options]
testpaths = ["tests"]
