[project]
name = "sigshell"
version = "0.1.0"
description = "A natural-language shell for the sigscores R package, served over MCP"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Enrico Adamo" }, { name = "Marco Riva" }]
dependencies = ["mcp==2.3.0"]

[project.scripts]
sigshell-server = "sigshell.server:main"

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sigshell"]

[tool.pytest.ini_options]
testpaths = ["tests"]
